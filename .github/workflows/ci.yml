name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # 本 workflow 只读代码，不 push、不调 API。
          # 不留 token 在 .git/config 里给后续 step。
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint (undefined names / redefinitions only)
        # 只挑这个代码库真正会踩的坑：2342 行单文件、69 个方法里打错的名字或
        # 重复定义的方法，正好落在单测走不到的分支上，运行时只会变成
        # "自动化流程出现未预期异常" + 退出码 1，连 traceback 都没有。
        run: pipx run ruff check --select F821,F811,E9 main.py gui.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

      - name: Compile Python files
        run: python -m py_compile main.py gui.py tests\test_closed_page_guards.py tests\test_course_card_dom.py tests\test_course_matching.py tests\test_env_documented.py tests\test_fast_actions.py tests\test_gui.py tests\test_login_check.py tests\test_video_progress.py

      - name: Check CLI help
        run: python main.py --help
